name: Windows x64 CMake DLL Build & Release

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-release:
    runs-on: windows-2022

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Parse Commit Message for Version
        id: check_msg
        shell: pwsh
        run: |
          $msg = @"
          ${{ github.event.head_commit.message }}
          "@

          if ($msg -match '\[v(\d+\.\d+\.\d+)\]') {
              $version = $Matches[1]
              echo "MATCH_FOUND=true" >> $env:GITHUB_OUTPUT
              echo "VERSION=v$version" >> $env:GITHUB_OUTPUT
              Write-Host "Found version pattern: v$version"
          } else {
              echo "MATCH_FOUND=false" >> $env:GITHUB_OUTPUT
              Write-Host "No version pattern found."
          }

      - name: Configure CMake
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64

      - name: Build Project
        run: |
          cmake --build build --config Release

      - name: Show Build Output
        shell: pwsh
        run: |
          Get-ChildItem -Path build -Recurse -Filter *.dll |
            Select-Object FullName

      - name: Create GitHub Release
        if: steps.check_msg.outputs.MATCH_FOUND == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_msg.outputs.VERSION }}
          name: ${{ steps.check_msg.outputs.VERSION }}
          body: ""
          draft: false
          prerelease: false
          files: |
            build/plugin/Release/*.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}